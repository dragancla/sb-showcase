name: "Lint, scan, validate and dry-run"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_call:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-scan:
    name: "Lint, scan, validate"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Nomad
        uses: hashicorp/setup-nomad@v2
        with:
          version: "1.7.5"

      - name: Setup Helm
        uses: azure/setup-helm@v4
        with:
          version: "v3.14.0"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.5"
          terraform_wrapper: false

      - name: Validate Nomad Job
        run: |
          nomad job validate nomad-jobs/sb.nomad.hcl

      - name: Lint and Template Helm Chart
        run: |
          helm lint charts/sb
          helm template dryrun-test charts/sb --namespace sb > /dev/null

      - name: Terraform Init
        working-directory: ./terraform
        run: terraform init

      - name: Terraform Format Check
        working-directory: ./terraform
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: ./terraform
        run: terraform validate

      - name: Terraform Plan (Dry-Run)
        id: plan
        working-directory: ./terraform
        run: |
          terraform plan -no-color -out=tfplan
          terraform show -no-color tfplan > plan_summary.txt
          cat plan_summary.txt

      - name: Run Trivy Security Scan (IaC Misconfigurations)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: "config"
          scan-ref: "."
          hide-progress: true
          format: "table"
          exit-code: "0" # Set to 1 for hard policy enforcement
          severity: "HIGH,CRITICAL"

      - name: Post Plan Summary to PR
        uses: actions/github-script@v7
        if: github.event_name == 'pull_request'
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('./terraform/plan_summary.txt', 'utf8');
            const output = `#### Terraform Plan
            \`\`\`hcl
            ${plan.length > 60000 ? plan.substring(0, 60000) + '... (truncated)' : plan}
            \`\`\`
            *✌️*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });
