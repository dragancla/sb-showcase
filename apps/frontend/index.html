<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>SB Showcase</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 40px; }
    .card { background: #1e293b; border-radius: 8px; padding: 24px; max-width: 600px; margin: 0 auto; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.5); }
    h1 { font-size: 20px; color: #38bdf8; margin-top: 0; }
    .status-badge { display: inline-block; padding: 4px 10px; border-radius: 9999px; font-size: 12px; font-weight: bold; background: #22c55e; color: #052e16; }
    pre { background: #0f172a; padding: 12px; border-radius: 4px; overflow-x: auto; color: #94a3b8; font-size: 13px; }
  </style>
</head>
<body>
  <div class="card">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h1>SB Showcase</h1>
      <span class="status-badge">CONNECTED</span>
    </div>
    <p>Target: <strong>Kubernetes & HashiCorp Nomad</strong></p>
    <p>API status:</p>
    <pre id="payload">Checking backend...</pre>
  </div>
  <script>
    fetch('/api/data')
      .then(res => res.json())
      .then(data => { document.getElementById('payload').textContent = JSON.stringify(data, null, 2); })
      .catch(err => { document.getElementById('payload').textContent = 'Backend not reachable.'; });
  </script>
</body>
</html>
