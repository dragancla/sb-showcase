apiVersion: apps/v1
kind: Deployment
metadata:
  name: sb-frontend
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  selector:
    matchLabels:
      app: sb-frontend
  template:
    metadata:
      labels:
        app: sb-frontend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
      containers:
        - name: web
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          image: "{{ .Values.frontend.image }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.frontend.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.frontend.port }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: sb-frontend
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: {{ .Values.frontend.port }}
      nodePort: 30080
  selector:
    app: sb-frontend
