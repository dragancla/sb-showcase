apiVersion: v1
kind: Secret
metadata:
  name: sb-db-secret
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.db.password | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sb-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sb-db
  template:
    metadata:
      labels:
        app: sb-db
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.db.image }}"
          ports:
            - containerPort: {{ .Values.db.port }}
          env:
            - name: POSTGRES_DB
              value: "{{ .Values.db.name }}"
            - name: POSTGRES_USER
              value: "{{ .Values.db.user }}"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: sb-db-secret
                  key: POSTGRES_PASSWORD
          resources:
            {{- toYaml .Values.db.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  ports:
    - port: {{ .Values.db.port }}
      targetPort: {{ .Values.db.port }}
  selector:
    app: sb-db
