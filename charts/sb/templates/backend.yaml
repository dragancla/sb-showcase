apiVersion: apps/v1
kind: Deployment
metadata:
  name: sb-backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  selector:
    matchLabels:
      app: sb-backend
  template:
    metadata:
      labels:
        app: sb-backend
    spec:
      securityContext:
        runAsNonRoot: {{ .Values.securityDefaults.runAsNonRoot }}
        runAsUser: {{ .Values.securityDefaults.runAsUser }}
        runAsGroup: {{ .Values.securityDefaults.runAsGroup }}
      containers:
        - name: api
          securityContext:
            allowPrivilegeEscalation: {{ .Values.securityDefaults.allowPrivilegeEscalation }}
            capabilities:
              drop: {{ .Values.securityDefaults.capabilities.drop }}
          image: "{{ .Values.backend.image }}:{{ .Values.global.imageTag }}"
          imagePullPolicy: {{ .Values.backend.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.backend.port }}
          env:
            - name: PORT
              value: "{{ .Values.backend.port }}"
            - name: DB_HOST
              value: "db"
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.backend.port }}
            initialDelaySeconds: 2
            periodSeconds: 5
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  ports:
    - port: {{ .Values.backend.port }}
      targetPort: {{ .Values.backend.port }}
  selector:
    app: sb-backend
